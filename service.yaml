apiVersion: v1
kind: Service
metadata:
  name: nodejs-service
spec:
  type: NodePort
  selector:
    app:  my-app
  ports:
    - protocol: TCP
      port: 80         # Port exposed inside the cluster
      targetPort: 3000 # Port your container/pod is listening on
      nodePort: 30007  # Optional: External port on the node (30000-32767)
